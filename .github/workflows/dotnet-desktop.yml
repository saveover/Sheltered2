# .github/workflows/dotnet-desktop.yml
#
# Two distribution artifacts from one source:
#   1. Portable self-contained zips -> GitHub Releases
#   2. Unsigned MSIX uploads        -> Partner Center

name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: SaveOver.Sheltered2.csproj

jobs:
  # ---------------------------------------------------------------------------
  # Portable build, self-contained, no runtime install.
  # This is what most users download from Releases.
  # ---------------------------------------------------------------------------
  portable:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            rid: win-x86
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@main
        with:
          global-json-file: global.json

      - name: Resolve version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: pwsh
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') {
            $env:REF_NAME -replace '^v', ''
          } else {
            [xml]$project = Get-Content $env:PROJECT
            [string](@($project.Project.PropertyGroup.Version | Where-Object { $_ })[0])
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$version' is not MAJOR.MINOR.PATCH"
          }
          foreach ($component in $version.Split('.')) {
            [uint16]$parsed = 0
            if (-not [uint16]::TryParse($component, [ref]$parsed)) {
              throw "Version '$version' contains a component outside the 0-65535 range"
            }
          }
          "APP_VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Building version $version"

      - name: Restore
        run: >
          dotnet restore $env:PROJECT
          -r ${{ matrix.rid }}
          -p:Configuration=Release-Unpackaged
          -p:Platform=${{ matrix.platform }}
          -p:PublishProfile=${{ matrix.rid }}

      - name: Publish
        run: >
          dotnet publish $env:PROJECT
          -c Release-Unpackaged
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          -p:PublishProfile=${{ matrix.rid }}
          -p:Version=$env:APP_VERSION
          -p:ContinuousIntegrationBuild=true
          --no-restore
          -o publish/${{ matrix.rid }}

      # A single-file publish embeds the Windows App SDK, PRI resources,
      # application content, and other runtime dependencies in the executable.
      # A portable PDB may remain beside it.
      - name: Verify publish output
        shell: pwsh
        run: |
          $dir = "publish/${{ matrix.rid }}"
          $exePath = Join-Path $dir 'SaveOver.Sheltered2.exe'
          if (-not (Test-Path $exePath -PathType Leaf)) {
            throw "Missing SaveOver.Sheltered2.exe in $dir"
          }

          $exe = Get-Item $exePath
          $pdbPath = Join-Path $dir 'SaveOver.Sheltered2.pdb'
          $allowed = @(
            [IO.Path]::GetFullPath($exePath),
            [IO.Path]::GetFullPath($pdbPath)
          )
          $unexpected = @(
            Get-ChildItem $dir -Recurse -File |
              Where-Object FullName -NotIn $allowed
          )
          if ($unexpected.Count -gt 0) {
            $names = $unexpected.FullName -join ', '
            throw "Expected a single-file publish, but found loose payload files: $names"
          }

          Write-Host "Single-file publish looks complete ($($exe.Length) bytes)."

      - name: Upload portable artifact
        uses: actions/upload-artifact@main
        with:
          name: portable-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # MSIX build for the Store.
  # ---------------------------------------------------------------------------
  msix:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [x86, x64, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@main
        with:
          global-json-file: global.json

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@main

      # Store package versions have four components; the Store reserves the last.
      - name: Resolve and stamp version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: pwsh
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') {
            $env:REF_NAME -replace '^v', ''
          } else {
            [xml]$project = Get-Content $env:PROJECT
            [string](@($project.Project.PropertyGroup.Version | Where-Object { $_ })[0])
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$version' is not MAJOR.MINOR.PATCH"
          }
          foreach ($component in $version.Split('.')) {
            [uint16]$parsed = 0
            if (-not [uint16]::TryParse($component, [ref]$parsed)) {
              throw "Version '$version' contains a component outside the 0-65535 range"
            }
          }
          "APP_VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          [xml]$xml = Get-Content Package.appxmanifest
          $xml.Package.Identity.Version = "$version.0"
          $xml.Save((Resolve-Path Package.appxmanifest))
          Write-Host "Package version set to $version.0"

      - name: Build MSIX
        run: >
          msbuild $env:PROJECT
          /restore
          /p:Configuration=Release
          /p:Platform=${{ matrix.platform }}
          /p:Version=$env:APP_VERSION
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageDir="${{ github.workspace }}\AppPackages\\"
          /p:UapAppxPackageBuildMode=StoreUpload
          /p:AppxBundle=Never
          /p:AppxPackageSigningEnabled=false
          /p:AppxSymbolPackageEnabled=false
          /p:ContinuousIntegrationBuild=true
          /verbosity:minimal

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@main
        with:
          name: msix-${{ matrix.platform }}
          path: AppPackages/**/*.msixupload
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    needs: [portable, msix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download portable builds
        uses: actions/download-artifact@main
        with:
          pattern: portable-*
          path: artifacts

      - name: Zip each architecture
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem artifacts -Directory | ForEach-Object {
            $arch = $_.Name -replace '^portable-', ''
            $out  = "dist/SaveOver-Sheltered2-$arch-$env:RELEASE_TAG.zip"
            Compress-Archive -Path "$($_.FullName)/*" -DestinationPath $out
          }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $files = Get-ChildItem dist/*.zip | ForEach-Object { $_.FullName }
          gh release create $env:RELEASE_TAG $files --generate-notes --verify-tag
