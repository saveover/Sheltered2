# .github/workflows/release.yml
#
# Two distribution artifacts from one source:
#   1. Portable self-contained zips -> GitHub Releases
#   2. Unsigned MSIX uploads        -> Partner Center

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: SaveOver.Sheltered2.csproj

jobs:
  # ---------------------------------------------------------------------------
  # Portable build, self-contained, no runtime install.
  # This is what most users download from Releases.
  # ---------------------------------------------------------------------------
  portable:
    runs-on: windows-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            rid: win-x86
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Resolve version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: pwsh
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') {
            $env:REF_NAME -replace '^v', ''
          } else {
            [xml]$project = Get-Content $env:PROJECT
            [string](@($project.Project.PropertyGroup.Version | Where-Object { $_ })[0])
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$version' is not MAJOR.MINOR.PATCH"
          }
          foreach ($component in $version.Split('.')) {
            [uint16]$parsed = 0
            if (-not [uint16]::TryParse($component, [ref]$parsed)) {
              throw "Version '$version' contains a component outside the 0-65535 range"
            }
          }
          "APP_VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Building version $version"

      - name: Restore
        run: >
          dotnet restore $env:PROJECT
          -r ${{ matrix.rid }}
          -p:Configuration=Release-Unpackaged
          -p:Platform=${{ matrix.platform }}
          -p:PublishProfile=${{ matrix.rid }}

      - name: Publish
        run: >
          dotnet publish $env:PROJECT
          -c Release-Unpackaged
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          -p:PublishProfile=${{ matrix.rid }}
          -p:Version=$env:APP_VERSION
          -p:ContinuousIntegrationBuild=true
          --no-restore
          -o publish/${{ matrix.rid }}

      # A single-file publish embeds the Windows App SDK, PRI resources,
      # application content, managed symbols, and other runtime dependencies.
      - name: Verify publish output
        shell: pwsh
        run: |
          $dir = "publish/${{ matrix.rid }}"
          $exePath = Join-Path $dir 'SaveOver for Sheltered2.exe'
          if (-not (Test-Path $exePath -PathType Leaf)) {
            throw "Missing 'SaveOver for Sheltered2.exe' in $dir"
          }

          $exe = Get-Item $exePath
          $allowed = @([IO.Path]::GetFullPath($exePath))
          $unexpected = @(
            Get-ChildItem $dir -Recurse -File |
              Where-Object FullName -NotIn $allowed
          )
          if ($unexpected.Count -gt 0) {
            $names = $unexpected.FullName -join ', '
            throw "Expected a single-file publish, but found loose payload files: $names"
          }

          Write-Host "Single-file publish looks complete ($($exe.Length) bytes)."

      - name: Upload portable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # MSIX build for the Store.
  # ---------------------------------------------------------------------------
  msix:
    runs-on: windows-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        platform: [x86, x64, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      # Store package versions have four components; the Store reserves the last.
      - name: Resolve and stamp version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: pwsh
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') {
            $env:REF_NAME -replace '^v', ''
          } else {
            [xml]$project = Get-Content $env:PROJECT
            [string](@($project.Project.PropertyGroup.Version | Where-Object { $_ })[0])
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$version' is not MAJOR.MINOR.PATCH"
          }
          foreach ($component in $version.Split('.')) {
            [uint16]$parsed = 0
            if (-not [uint16]::TryParse($component, [ref]$parsed)) {
              throw "Version '$version' contains a component outside the 0-65535 range"
            }
          }
          "APP_VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          [xml]$xml = Get-Content Package.appxmanifest
          $xml.Package.Identity.Version = "$version.0"
          $xml.Save((Resolve-Path Package.appxmanifest))
          Write-Host "Package version set to $version.0"

      - name: Build MSIX
        run: >
          msbuild $env:PROJECT
          /restore
          /p:Configuration=Release
          /p:Platform=${{ matrix.platform }}
          /p:Version=$env:APP_VERSION
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageDir="${{ github.workspace }}\AppPackages\\"
          /p:UapAppxPackageBuildMode=StoreUpload
          /p:AppxBundle=Never
          /p:AppxPackageSigningEnabled=false
          /p:AppxSymbolPackageEnabled=false
          /p:ContinuousIntegrationBuild=true
          /verbosity:minimal

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msix-${{ matrix.platform }}
          path: AppPackages/**/*.msixupload
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    needs: [portable, msix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download portable builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: portable-*
          path: artifacts

      - name: Zip each architecture
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem artifacts -Directory | ForEach-Object {
            $arch = $_.Name -replace '^portable-', ''
            $out  = "dist/SaveOver-Sheltered2-$arch-$env:RELEASE_TAG.zip"
            Compress-Archive -Path "$($_.FullName)/*" -DestinationPath $out
          }

      # Keep the release private so its notes can be reviewed before publication.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $previousTag = gh release view --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $previousTag) {
            $changelogUrl = "https://github.com/$env:GH_REPO/compare/$previousTag...$env:RELEASE_TAG"
          } else {
            $changelogUrl = "https://github.com/$env:GH_REPO/commits/$env:RELEASE_TAG"
          }

          @"
          # 📃 Release notes

          **Full Changelog**: $changelogUrl

          ## Added

          <!-- Describe new features here. -->

          ## Changed

          <!-- Describe changes to existing functionality here; i.e. the behavior worked as intended, and now works differently. -->

          ## Deprecated

          <!-- Describe soon-to-be removed features here. -->

          ## Removed

          <!-- Describe now removed features here. -->

          ## Fixed

          <!-- Describe bug fixes here; i.e. the behavior was wrong, and is now correct. -->

          ## Security

          <!-- Describe vulnerabilities here; the change addresses a vulnerability. It could fit under Fixed or Changed, but its urgency and audience are different. -->
          "@ | Out-File release-notes.md -Encoding utf8

          $files = Get-ChildItem dist/*.zip | ForEach-Object { $_.FullName }
          gh release create $env:RELEASE_TAG $files `
            --draft `
            --notes-file release-notes.md `
            --title $env:RELEASE_TAG `
            --verify-tag
            
      - name: Scan release assets with VirusTotal
        id: virustotal
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            dist/*.zip

      - name: Add VirusTotal results to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VT_ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --json body --jq .body |
            Out-File release-notes.md -Encoding utf8

          @(
            ''
            '# 🛡️ VirusTotal analysis'
            ''
            ($env:VT_ANALYSIS -split ',' | ForEach-Object {
              $parts = $_ -split '=', 2
              if ($parts.Count -ne 2) {
                throw "Unexpected VirusTotal analysis output: '$_'"
              }
              $fileName = [IO.Path]::GetFileName($parts[0])
              "- [$fileName]($($parts[1]))"
            })
          ) | Add-Content release-notes.md -Encoding utf8

          gh release edit $env:RELEASE_TAG --notes-file release-notes.md
